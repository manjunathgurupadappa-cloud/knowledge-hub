{% extends "auth_base.html" %}
{% block title %}Create account{% endblock %}
{% block auth_content %}
  <h2 class="h3 mb-1">Create your account</h2>
  <p class="text-muted mb-4">It takes less than a minute.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-primary w-100 mt-2">Create account</button>
  </form>
  <p class="text-center text-muted mt-4 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
