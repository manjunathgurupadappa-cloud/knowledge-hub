{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block auth_content %}
  <h2 class="h3 mb-1">Log in</h2>
  <p class="text-muted mb-4">Welcome back. Enter your details to continue.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
  </form>
  <p class="text-center text-muted mt-4 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
{% endblock %}
