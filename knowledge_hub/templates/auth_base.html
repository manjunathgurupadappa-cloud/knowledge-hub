{% extends "base.html" %}
{% block shell %}
<div class="auth-wrap">
  <div class="auth-intro d-none d-md-flex">
    <div>
      <div class="brand mb-4"><i class="bi bi-journal-bookmark-fill me-2"></i>Knowledge Hub</div>
      <h1 class="display-6">Write down what you learn. Keep track of what you read.</h1>
      <p class="mt-3 mb-0 opacity-75">One private place for your learning logs, topics and bookshelf.</p>
    </div>
  </div>
  <div class="auth-panel">
    <div class="auth-card">
      <div class="brand text-center mb-4 d-md-none text-dark-ink"><i class="bi bi-journal-bookmark-fill me-2"></i>Knowledge Hub</div>
      {% include "partials/messages.html" %}
      {% block auth_content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
