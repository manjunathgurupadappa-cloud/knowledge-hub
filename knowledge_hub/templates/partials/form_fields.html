{% if form.non_field_errors %}
  <div class="alert alert-danger" role="alert">
    {% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}
  </div>
{% endif %}
{% for field in form %}
  <div class="mb-3{% if field.errors %} field-has-error{% endif %}">
    <label for="{{ field.id_for_label }}" class="form-label fw-medium">
      {{ field.label }}{% if field.field.required %}<span class="text-danger" aria-hidden="true"> *</span>{% endif %}
    </label>
    {{ field }}
    {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  </div>
{% endfor %}
